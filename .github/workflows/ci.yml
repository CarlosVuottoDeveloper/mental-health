# Runs the same checks as the pre-push hook on GitHub, so they can't be
# skipped locally. `verify` is a required check for merging into main (LPC-5).
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Git hooks are for local commits only.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      # Same major version as the Vercel build.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run build
